<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin conexión — KinesioTurno UCI</title>
<meta name="theme-color" content="#2B3674">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; background: #F4F7FE;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .logo {
    width: 84px; height: 84px; border-radius: 22px; background: #4F46E5; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 22px;
    box-shadow: 0 12px 28px rgba(79, 70, 229, .28);
  }
  h1 { font-size: 21px; font-weight: 800; color: #2B3674; margin: 0 0 10px; }
  p  { font-size: 14.5px; line-height: 1.6; color: #6B7280; font-weight: 500; max-width: 340px; margin: 0 0 6px; }
  button {
    margin-top: 22px; padding: 14px 30px; background: #4F46E5; color: #fff;
    border: 0; border-radius: 14px; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="logo">KT</div>
  <h1>Sin conexión</h1>
  <p>KinesioTurno necesita internet para mostrar los turnos y registrar permisos.</p>
  <p>Revisa tu conexión y vuelve a intentar.</p>
  <button onclick="location.replace('./index.html')">↻ Reintentar</button>
</body>
</html>
